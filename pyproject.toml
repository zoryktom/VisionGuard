[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionguard"
version = "1.0.0"
description = "Real-time AI system for detecting safety hazards in video streams."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Zorykto" }]
keywords = [
  "computer-vision",
  "object-detection",
  "safety",
  "yolo",
  "realtime",
  "pytorch",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "torch>=2.1.0",
  "torchvision>=0.16.0",
  "ultralytics>=8.2.0",
  "opencv-python-headless>=4.8.0",
  "numpy>=1.24.0",
  "pillow>=10.0.0",
  "pyyaml>=6.0.1",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "python-multipart>=0.0.9",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "httpx>=0.27.0",
  "websockets>=12.0",
  "onnx>=1.15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.4.0",
  "mypy>=1.8.0",
  "types-PyYAML>=6.0.0",
  "pre-commit>=3.6.0",
]
train = [
  "albumentations>=1.4.0",
  "torchmetrics>=1.3.0",
]
export = [
  "onnxruntime>=1.17.0",
]
ui = [
  "jinja2>=3.1.0",
]

[project.scripts]
visionguard = "visionguard.cli:app"

[project.urls]
Homepage = "https://github.com/zoryktom/VisionGuard"
Issues = "https://github.com/zoryktom/VisionGuard/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
visionguard = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "api", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501", "B008", "N812"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]
"notebooks/**" = ["E402"]
"src/visionguard/cli.py" = ["B008"]
"scripts/**" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
mypy_path = "src"
packages = ["visionguard"]

[tool.coverage.run]
source = ["src/visionguard", "api"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true
